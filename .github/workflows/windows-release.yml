name: Windows installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Prepare browser libraries
        run: npm run vendor
      - name: Browser smoke test
        run: npm run test:smoke
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdown-viewer-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME src-tauri/target/release/bundle/nsis/*-setup.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME src-tauri/target/release/bundle/nsis/*-setup.exe --repo $env:GITHUB_REPOSITORY --title "Markdown Viewer $env:GITHUB_REF_NAME" --generate-notes
          }
